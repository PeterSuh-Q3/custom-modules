name: Copy Module Tarballs to tcrp-modules

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build DSM bzImage + Modules (All Platforms)"]
    types:
      - completed
    branches:
      - master

jobs:
  copy:
    name: Copy .tgz to tcrp-modules and update JSON sha256
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout custom-modules master (build artifacts)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/custom-modules
          ref: master
          path: custom-modules

      - name: Checkout tcrp-modules (destination)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/tcrp-modules
          ref: main
          path: tcrp-modules
          token: ${{ secrets.PAT }}

      - name: Checkout redpill-load (bzImage destination)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/redpill-load
          ref: master
          path: redpill-load
          token: ${{ secrets.PAT }}

      - name: Copy tarballs and update JSON sha256
        run: |
          set -eux
          RELEASES="tcrp-modules/custom-modules/releases"
          SOURCE_DSM_VER="7.3"
          KVER="5.10.55"

          for PLATFORM in epyc7002 geminilakenk r1000nk v1000nk; do
            SRC="custom-modules/${PLATFORM}-${SOURCE_DSM_VER}-${KVER}.tgz"

            if [ ! -f "$SRC" ]; then
              echo "ERROR: $SRC not found"
              exit 1
            fi

            # 7.4 uses the same 5.10.55 build as 7.3, under a 7.4 filename.
            for DSM_VER in 7.3 7.4; do
              TGZ="${PLATFORM}-${DSM_VER}-${KVER}.tgz"
              DST="${RELEASES}/${TGZ}"
              JSON_PATH="${RELEASES}/${PLATFORM}-${DSM_VER}.json"

              cp "$SRC" "$DST"
              NEW_SHA=$(sha256sum "$DST" | awk '{print $1}')
              echo "${PLATFORM} ${DSM_VER}: ${NEW_SHA}"

              if [ ! -f "$JSON_PATH" ]; then
                echo "ERROR: $JSON_PATH not found"
                exit 1
              fi
              if ! jq -e --arg name "$TGZ" 'any(.files[]; .name == $name)' "$JSON_PATH" > /dev/null; then
                echo "ERROR: $JSON_PATH does not reference $TGZ"
                exit 1
              fi
              jq --arg name "$TGZ" --arg sha "$NEW_SHA" \
                '.files |= map(if .name == $name then .sha256 = $sha else . end)' \
                "$JSON_PATH" > /tmp/updated.json && mv /tmp/updated.json "$JSON_PATH"
              echo "Updated $JSON_PATH"
            done
          done

      - name: Commit and push to tcrp-modules
        run: |
          set -eux
          cd tcrp-modules
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom-modules/releases/*.tgz custom-modules/releases/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update module tarballs + sha256 from custom-modules master (run ${{ github.run_id }})"
            git push origin main
          fi

      - name: Copy bzImage files to redpill-load
        run: |
          set -eux
          SOURCE_DSM_VER="7.3"
          KVER="5.10.55"
          ZIMAGE_DST="redpill-load/ext/custom-zImage"
          mkdir -p "$ZIMAGE_DST"

          for PLATFORM in epyc7002 geminilakenk r1000nk v1000nk; do
            SRC="custom-modules/bzImage-${PLATFORM}-${SOURCE_DSM_VER}-${KVER}.gz"

            if [ ! -f "$SRC" ]; then
              echo "ERROR: $SRC not found"
              exit 1
            fi

            for DSM_VER in 7.3 7.4; do
              BZIMAGE="bzImage-${PLATFORM}-${DSM_VER}-${KVER}.gz"
              cp "$SRC" "${ZIMAGE_DST}/${BZIMAGE}"
              echo "Copied: ${BZIMAGE}"
            done
          done

      - name: Commit and push bzImage to redpill-load
        run: |
          set -eux
          cd redpill-load
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ext/custom-zImage/bzImage-*.gz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update bzImage from custom-modules master (run ${{ github.run_id }})"
            git push origin master
          fi
